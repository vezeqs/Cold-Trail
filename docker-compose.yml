services:
  coldtrail:
    build: .
    image: coldtrail:0.9.0
    container_name: coldtrail
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - coldtrail-data:/data
    environment:
      COLDTRAIL_DB: /data/coldtrail.db
      # Required: the container binds 0.0.0.0 and refuses to start without a token.
      COLDTRAIL_WEB_TOKEN: ${COLDTRAIL_WEB_TOKEN:?set COLDTRAIL_WEB_TOKEN to a long random string}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HIBP_API_KEY: ${HIBP_API_KEY:-}
      EMAILREP_API_KEY: ${EMAILREP_API_KEY:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      # Route through the tor sidecar (enable with: --profile tor).
      COLDTRAIL_PROXY: ${COLDTRAIL_PROXY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  tor:
    image: dperson/torproxy:latest
    container_name: coldtrail-tor
    restart: unless-stopped
    profiles: ["tor"]
    expose:
      - "9050"

volumes:
  coldtrail-data:
