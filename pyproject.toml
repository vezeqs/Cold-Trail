[project]
name = "coldtrail"
version = "0.9.0"
description = "ColdTrail: OSINT username/email pivoting and public profile & post harvesting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "osint",
    "threat-intelligence",
    "username-enumeration",
    "email-osint",
    "identity-correlation",
    "digital-forensics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "cryptography>=42,<47",
    "defusedxml>=0.7,<1",
    "httpx[socks]>=0.27,<1",
    "pillow>=10,<13",
    "phonenumbers>=8.13,<10",
    "pydantic>=2.7,<3",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
    "textual>=0.80,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
coldtrail = "coldtrail.cli:app"

[project.urls]
Homepage = "https://vezeqs.github.io/Cold-Trail/"
Repository = "https://github.com/vezeqs/Cold-Trail"
Changelog = "https://github.com/vezeqs/Cold-Trail/blob/master/CHANGELOG.md"
Security = "https://github.com/vezeqs/Cold-Trail/blob/master/SECURITY.md"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "respx>=0.21,<1",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coldtrail"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Textual's compose() expresses the widget tree through nested `with` blocks.
"src/coldtrail/tui/app.py" = ["SIM117"]
