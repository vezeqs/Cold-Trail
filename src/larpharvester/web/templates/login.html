{% extends "base.html" %}
{% block title %}Sign in · larpharvester{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">This larpharvester instance requires an access token.</p>
{% if error %}<p class="badge status-error">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="stack">
  <label>
    Access token
    <input type="password" name="token" required autofocus>
  </label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
