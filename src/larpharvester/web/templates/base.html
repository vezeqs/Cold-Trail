<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}larpharvester{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">larpharvester <span class="ver">v{{ version }}</span></a>
  <nav>
    <a href="/" class="{{ 'on' if active == 'dashboard' }}">Dashboard</a>
    <a href="/runs" class="{{ 'on' if active == 'runs' }}">Runs</a>
    <a href="/pivot" class="{{ 'on' if active == 'pivot' }}">New pivot</a>
    <a href="/tools" class="{{ 'on' if active == 'tools' }}">Tools</a>
    <a href="/diff" class="{{ 'on' if active == 'diff' }}">Diff</a>
    <a href="/search" class="{{ 'on' if active == 'search' }}">Search</a>
    <a href="/sources" class="{{ 'on' if active == 'sources' }}">Sources</a>
    <a href="/cases" class="{{ 'on' if active == 'cases' }}">Cases</a>
    <a href="/api/docs" target="_blank" rel="noopener">API</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>
  <span>{{ source_count }} sources registered</span>
  <span class="mono">{{ settings.db_path }}</span>
</footer>
</body>
</html>
